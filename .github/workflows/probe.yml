name: probe

on:
  push:
    paths: [".github/workflows/probe.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Probe exchange demo endpoints from the runner
        run: |
          probe() {
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 15 "$1" || echo ERR)
            echo "== $1 -> HTTP $code"
            head -c 200 /tmp/body; echo
          }
          {
            echo "runner ip country: $(curl -s https://ipinfo.io/country || echo unknown)"
            probe "https://testnet.binancefuture.com/fapi/v1/time"
            probe "https://testnet.binance.vision/api/v3/time"
            probe "https://demo-futures.kraken.com/derivatives/api/v3/instruments/PI_XBTUSD"
            probe "https://api.bitget.com/api/v2/public/time"
            probe "https://www.okx.com/api/v5/public/time"
            probe "https://fx-api-testnet.gateio.ws/api/v4/futures/usdt/contracts/BTC_USDT"
            probe "https://testnet.bitmex.com/api/v1/announcement"
          } > probe_result.txt
          cat probe_result.txt

      - name: Commit result
        run: |
          git config user.name probe
          git config user.email probe@users.noreply.github.com
          git add probe_result.txt
          git commit -m "probe result [skip ci]" || true
          git pull --rebase origin main || true
          git push || true
