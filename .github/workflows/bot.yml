name: trading-bot

on:
  schedule:
    - cron: "*/15 * * * *"   # every ~15 minutes (GitHub may add a few minutes of delay)
  workflow_dispatch: {}       # manual run button

concurrency:
  group: trading-bot
  cancel-in-progress: false

permissions:
  contents: write             # to commit bot.db (state) back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run one trading pass
        env:
          # Bybit is CloudFront-geo-blocked from US runner IPs; Binance testnet
          # registration needs a Binance account -> OKX Demo Trading it is.
          EXCHANGE: okx
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_ENABLED: ${{ vars.LLM_ENABLED }}
        run: python runner_once.py

      - name: Commit state (bot.db)
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bot.db
          if ! git diff --cached --quiet; then
            git commit -m "state update [skip ci]"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push || true
          fi
