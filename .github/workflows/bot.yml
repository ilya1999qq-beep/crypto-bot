name: trading-bot

on:
  schedule:
    - cron: "*/15 * * * *"   # every ~15 minutes (GitHub may add a few minutes of delay)
  workflow_dispatch: {}       # manual run button
  push:
    branches: [main]          # a code update runs immediately on the NEW code
                              # (state commits carry [skip ci], so no loop)

concurrency:
  group: trading-bot
  cancel-in-progress: false

permissions:
  contents: write             # to commit bot.db (state) back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run one trading pass
        env:
          # Every real demo venue is out of reach: Bybit is geo-blocked from US
          # runner IPs, Binance testnet needs a Binance account, OKX/Bitget demo
          # need identity verification. So: real prices, simulated fills.
          EXCHANGE: paper
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_ENABLED: ${{ vars.LLM_ENABLED }}
        # Keep a readable log of the pass. Secrets are masked in the Actions UI
        # but NOT in files, and request errors can echo the bot-API URL, so the
        # token is redacted before anything is written to disk.
        run: |
          python runner_once.py 2>&1 \
            | sed -e "s|${TELEGRAM_TOKEN:-__nope__}|<TELEGRAM_TOKEN>|g" \
            | tee last_run.log

      - name: Commit state (bot.db)
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bot.db last_run.log
          if ! git diff --cached --quiet; then
            git commit -m "state update [skip ci]"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push || true
          fi
